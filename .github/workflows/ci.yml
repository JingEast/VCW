name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Stage 1: Lint
  # ==========================================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 mypy

      - name: flake8
        run: flake8 . --max-line-length=120

      - name: mypy
        run: mypy . --ignore-missing-imports

      # REL-04: Verify branch protection on main
      - name: Check branch protection
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
            RESPONSE=$(curl -s -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${REPO}/branches/${BRANCH}/protection")
            if echo "$RESPONSE" | grep -q '"message":"Branch not protected"'; then
              echo "::warning::REL-04: Branch protection not configured on ${BRANCH}. Enable at: https://github.com/${REPO}/settings/branches"
            elif echo "$RESPONSE" | grep -q '"message":"Not Found"'; then
              echo "::warning::REL-04: Unable to verify branch protection (token permissions or branch missing)."
            else
              echo "✅ REL-04: Branch protection verified on ${BRANCH}."
            fi
          else
            echo "Branch protection check skipped for branch: ${BRANCH}"
          fi

  # ==========================================================================
  # Stage 2: Test + Coverage
  # ==========================================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run tests with coverage
        run: pytest tests/ -m "not slow" -v --tb=short --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov (optional)
        if: github.event_name == 'push'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "Uploading coverage to Codecov..."
            curl -Os https://uploader.codecov.io/latest/linux/codecov
            chmod +x codecov
            ./codecov -t "$CODECOV_TOKEN" -f coverage.xml || true
          else
            echo "::warning::CODECOV_TOKEN not configured; coverage upload skipped."
          fi

  # ==========================================================================
  # Stage 3: Migration Check (Alembic)
  # ==========================================================================
  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vcw
          POSTGRES_PASSWORD: vcw
          POSTGRES_DB: vcw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg2://vcw:vcw@localhost:5432/vcw
        run: python -m alembic upgrade head

      - name: Alembic check (schema drift detection)
        env:
          DATABASE_URL: postgresql+psycopg2://vcw:vcw@localhost:5432/vcw
        run: python scripts/check_migrations.py

  # ==========================================================================
  # Stage 4: Docker Build & Smoke Test
  # 前置条件: lint + test + migration-check 全部通过
  # ==========================================================================
  docker-smoke:
    needs: [lint, test, migration-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 移除本地开发用的 .env，防止 Docker Compose 读取并将 localhost 地址注入容器
      - name: Remove local .env to prevent Docker Compose pollution
        run: rm -f .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose -p vcw build

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: vcw-web
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # 基础镜像 python:3.12-slim（Debian trixie）的 OS 级漏洞会频繁触发
          # CRITICAL/HIGH；docker-smoke 重在验证构建与运行，不将其作为阻塞门。
          # SARIF 报告仍会上传到 GitHub Security → Code scanning alerts 供审计。
          exit-code: 0
          ignore-unfixed: true

      - name: Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Smoke test
        run: bash scripts/ci-smoke-test.sh

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: |
            docker-logs/

      - name: Cleanup
        if: always()
        run: docker compose -p vcw down -v --remove-orphans

  # ==========================================================================
  # Stage 5: Push to Docker Hub
  # 前置条件: docker-smoke 通过
  # 触发条件: push 到 main/master 分支
  # ==========================================================================
  push:
    needs: [docker-smoke]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker Hub secrets
        id: docker_secrets
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DOCKER_USERNAME or DOCKER_PASSWORD not configured. Skipping Docker push."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.docker_secrets.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build images for push
        if: steps.docker_secrets.outputs.available == 'true'
        run: docker compose -p vcw build

      - name: Login to Docker Hub
        if: steps.docker_secrets.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag and push web image
        if: steps.docker_secrets.outputs.available == 'true'
        run: |
          docker tag vcw-web ${{ secrets.DOCKER_USERNAME }}/vcw-web:${{ github.sha }}
          docker tag vcw-web ${{ secrets.DOCKER_USERNAME }}/vcw-web:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/vcw-web:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/vcw-web:latest

      - name: Tag and push worker image
        if: steps.docker_secrets.outputs.available == 'true'
        run: |
          docker tag vcw-worker ${{ secrets.DOCKER_USERNAME }}/vcw-worker:${{ github.sha }}
          docker tag vcw-worker ${{ secrets.DOCKER_USERNAME }}/vcw-worker:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/vcw-worker:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/vcw-worker:latest

      - name: Tag and push beat image
        if: steps.docker_secrets.outputs.available == 'true'
        run: |
          docker tag vcw-beat ${{ secrets.DOCKER_USERNAME }}/vcw-beat:${{ github.sha }}
          docker tag vcw-beat ${{ secrets.DOCKER_USERNAME }}/vcw-beat:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/vcw-beat:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/vcw-beat:latest
